[package]
name = "andruavserver"
version = "6.0.1"
edition = "2021"
description = "DroneEngage communication server: WebSocket messaging between drone units and ground control stations, S2S relay and UDP relay brokering."
authors = ["Mohammad Said Hefny <mohammad.hefny@gmail.com>"]
license = "UNLICENSED"
publish = false

[lib]
name = "andruavserver"
path = "src/lib.rs"

[[bin]]
name = "andruavmainserver"
path = "src/main.rs"

[dependencies]
droneengage_server_common = { path = "../droneengage_server_common" }
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["pkcs8", "pem", "rand_core"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hmac = "0.12"
httparse = "1"
indexmap = "2"
rand = "0.8"
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.9", features = ["std"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
subtle = "2.5"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = "0.30"
uuid = { version = "1", features = ["v4"] }
webpki-roots = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
